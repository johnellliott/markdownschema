<!doctype html>
<!-- examples/cv-demo.html -->

<meta charset="utf-8">
<title>MarkdownSchema CV Demo</title>
<style>
  body { font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
  pre { background: #f6f8fa; padding: 12px; overflow: auto; }
  .ok { color: #0a7f2e; }
  .err { color: #b00020; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>

<h1>MarkdownSchema CV Demo</h1>
<p>This page compiles the schema, validates two Markdown files, and prints detailed errors.</p>

<div id="out"></div>

<script type="module">
  import { compileSchema, validateMarkdown } from '../src/markdownschema-validator.js?v=5';

  async function read(path) { const r = await fetch(path); return r.text(); }

  const schemaText = await read('./cv.schema.md');
  const validMd   = await read('./cv.valid.md');
  const invalidMd = await read('./cv.invalid.md');

  const compiled = compileSchema(schemaText);
  console.log('defs keys:', Object.keys(compiled.defs || {}));
  const exp = compiled.children.find(h => h.matcher?.type === 'exact' && h.matcher.value === 'Experience');
console.log('experience regex:', exp?.children?.[0]?.matcher?.pattern?.toString());

  const resValid = validateMarkdown(validMd, compiled);
  const resInvalid = validateMarkdown(invalidMd, compiled);

  const out = document.getElementById('out');

  function renderResult(title, result) {
    const card = document.createElement('div');
    card.className = 'card';
    const h = document.createElement('h2');
    h.textContent = title + (result.ok ? ' — OK' : ' — Violations found');
    h.className = result.ok ? 'ok' : 'err';
    card.appendChild(h);

    if (!result.ok) {
      const ul = document.createElement('ul');
      for (const e of result.errors) {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${e.code}</strong>: ${escapeHtml(e.message)}`
          + (e.path ? ` <em>[${escapeHtml(e.path)}]</em>` : '')
          + (e.line ? ` (line ${e.line})` : '');
        // Optional: dump expected/actual
        if (e.expected !== undefined || e.actual !== undefined) {
          const pre = document.createElement('pre');
          pre.textContent = JSON.stringify({ expected: e.expected, actual: e.actual }, null, 2);
          li.appendChild(pre);
        }
        ul.appendChild(li);
      }
      card.appendChild(ul);
    }
    out.appendChild(card);
  }

  function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  renderResult('Valid CV', resValid);
  renderResult('Invalid CV', resInvalid);
</script>
